name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: smartfleet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Testlar DB tayyor bo'lguncha kutsin
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DB_NAME: smartfleet_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      ESKIZ_MOCK: "True"

    steps:
      - uses: actions/checkout@v4

      - name: GeoDjango tizim kutubxonalari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils libproj-dev gdal-bin libgdal-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Migratsiyalar to'liqligini tekshirish
        # Modelda o'zgarish bo'lib migratsiya yozilmagan bo'lsa CI yiqiladi
        run: python manage.py makemigrations --check --dry-run

      - name: Django check
        run: python manage.py check

      - name: Testlar
        run: |
          pytest --create-db \
            --cov=apps --cov=services \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Qamrov hisobotini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.5.0
      - name: Ruff
        run: ruff check apps config services tests
