line-length = 100
target-version = "py311"

exclude = [
    "*/migrations/*",
    ".venv",
    "venv",
]

[lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort — import tartibi
    "UP",   # pyupgrade
    "B",    # bugbear
]
ignore = [
    "E501",   # uzun qatorlar (line-length allaqachon tekshiradi)
    "B008",   # DRF'da funksiya chaqiruvini default qilish normal
]

[lint.per-file-ignores]
# Testlarda fixture'lar "ishlatilmagan import" bo'lib ko'rinadi
"tests/*" = ["F401", "F811", "B011"]
"config/settings/*" = ["F403", "F405"]
